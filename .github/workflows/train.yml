name: Train ML Model

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache pip packages so repeat runs are faster
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      #5. Download data in GitHub Actions
      - name: Pull data from DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local dagshub access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify --local dagshub secret_access_key "$DAGSHUB_TOKEN"
          dvc pull -r dagshub

      # 6. Recreate the training and test datasets
      - name: Preprocess data
        run: python src/preprocess.py

      # 7. Select the threshold using training data only
      - name: Select threshold
        run: python src/select_threshold.py

      # 8. Train the final model
      - name: Train Random Forest
        run: python src/train.py

      # 9. Evaluate on the test set
      - name: Evaluate model
        run: python src/evaluate.py

      # 10. Check that all expected results exist
      - name: Verify result files
        run: |
          test -f metrics/threshold.json
          test -f metrics/metrics.json
          test -f plots/threshold.png
          test -f plots/model_results.png

      # 11. Upload evaluation results
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          if-no-files-found: error
          path: |
            metrics/threshold.json
            metrics/metrics.json
            plots/threshold.png
            plots/model_results.png
      
